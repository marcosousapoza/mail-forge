[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailforge-mcp"
version = "0.1.0"
description = "Provider-independent IMAP/SMTP email server for the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MailForge contributors" }]
keywords = ["mcp", "imap", "smtp", "email", "podman"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=1.21.0,<2",
  "pydantic>=2.11.0,<3",
]

[project.scripts]
mailforge-mcp = "mailforge.__main__:main"

[project.urls]
Homepage = "https://github.com/marcosousapoza/mail-forge"
Issues = "https://github.com/marcosousapoza/mail-forge/issues"

[dependency-groups]
dev = [
  "mypy>=1.18.0,<2",
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailforge"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests involving process or protocol boundaries"]

[tool.coverage.run]
branch = true
source = ["mailforge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
follow_untyped_imports = true
